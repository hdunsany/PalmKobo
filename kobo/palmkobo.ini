# palmkobo settings. Lines are "key = value"; '#' starts a comment.
# Relative paths are relative to this file's folder (.adds/palmkobo).

# --- Palm -------------------------------------------------------------------
# ROM image dumped from your own Palm m500 (Palm OS 4.1).
rom = m500.rom
device = PalmM500

# Your Palm's state is saved here on exit and restored on the next launch.
# Delete it to start over from a freshly booted ROM.
session = session.img

# Put .prc / .pdb files in this folder; they are installed on the next launch
# and then moved to install/installed (or install/failed).
install_dir = install

# hotsync_name = Huxley

# --- SD card --------------------------------------------------------------------
# A virtual SD card. It is created (empty, formatted) on first launch.
# Set to "none" to run without a card.
card = card.img
# Size of a newly created card: 4, 8, 16, 32, 64 or 128 MB.
card_size_mb = 64
# Files you put in this folder are copied onto the card at the next launch,
# then moved into to-card/imported. .prc/.pdb/.pqa files go to /PALM/Launcher,
# so they show up in the Palm launcher; other files keep their folder layout.
card_import_dir = to-card
# After every exit, this folder is updated to an exact copy of the card's
# contents, so you can copy Palm files off the Kobo over USB. Treat it as
# read-only: changes here are overwritten.
card_export_dir = card-contents

# --- Screen -------------------------------------------------------------------
# 0 = largest whole-number scale that fits (6x on a Clara BW).
scale = 0
silkscreen = silkscreen.pgm

# Draw your finger's path in the Graffiti area while writing.
graffiti_echo = 1

# e-ink waveforms: while touching / after you lift your finger / periodic cleanup.
waveform_fast = DU
waveform_quality = GL16
waveform_full = GC16
# Flashing full refresh after this many partial refreshes (clears ghosting).
full_refresh_every = 60
pen_interval_ms = 40
idle_delay_ms = 60
max_latency_ms = 250

# --- Touch --------------------------------------------------------------------
# "auto" uses FBInk's knowledge of your Kobo model. If taps land in the wrong
# place, run the "PalmOS input test" menu entry and set these to 0 or 1.
touch_swap_axes = auto
touch_mirror_x = auto
touch_mirror_y = auto
pen_throttle_ms = 20

# --- Misc ---------------------------------------------------------------------
# Wait this long after boot before installing apps (Palm OS must be running).
install_delay_ms = 8000
# Autosave: save the Palm (and SD card) at most every N minutes, during a
# 10-second pause in typing/tapping, so it never interrupts you. 0 = only on exit.
autosave_minutes = 5
# Save and exit back to the Kobo after this many minutes without any touch or
# key input, so the Kobo can sleep normally. A warning appears 1 minute before;
# tap the screen or press a key to stay. 0 = never.
idle_exit_minutes = 15
